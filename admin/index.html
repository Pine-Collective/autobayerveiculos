<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel do estoque | Autobayer</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#090a0c" />
    <!-- Caminhos absolutos de propósito: servido em /admin (sem barra final),
         um caminho relativo resolveria para /admin.css e daria 404. -->
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>

  <body>
    <!-- Tela de login -->
    <div class="login" id="telaLogin">
      <form class="login-card" id="formLogin">
        <img src="/assets/logo-autobayer.png" alt="Autobayer Veículos" width="430" height="160" />
        <h1>Painel do estoque</h1>
        <!-- Campo de usuário fixo e invisível: sem ele, gerenciadores de
             senha não oferecem salvar/preencher a senha do painel. -->
        <input
          class="visually-hidden"
          type="text"
          autocomplete="username"
          value="equipe"
          readonly
          tabindex="-1"
          aria-hidden="true"
        />
        <label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="current-password" required />
        <button class="btn btn-primary" type="submit" id="botaoEntrar">Entrar</button>
        <p class="aviso" id="avisoLogin" role="alert" hidden></p>
      </form>
    </div>

    <!-- Painel -->
    <div class="painel" id="painel" hidden>
      <header class="barra">
        <div class="barra-inner">
          <img
            src="/assets/logo-autobayer.png"
            alt="Autobayer"
            width="430"
            height="160"
            class="barra-logo"
          />
          <span class="barra-titulo">Estoque</span>
          <span class="pendencias" id="pendencias" hidden></span>
          <button class="btn btn-primary" id="botaoSalvar" type="button" disabled>Publicar</button>
          <button class="btn btn-ghost" id="botaoSair" type="button">Sair</button>
        </div>
      </header>

      <main class="conteudo">
        <div class="acoes">
          <div class="resumo" id="resumo"></div>
          <div class="acoes-botoes">
            <a class="btn btn-ghost" href="/" target="_blank" rel="noopener"> Ver o site ↗ </a>
            <button class="btn btn-secundario" id="botaoNovo" type="button">+ Novo veículo</button>
          </div>
        </div>

        <p class="faixa" id="faixaStatus" role="status" aria-live="polite" hidden></p>

        <ul class="lista" id="lista"></ul>
      </main>
    </div>

    <!-- Editor de veículo -->
    <div class="modal" id="modalEditor" hidden>
      <div class="modal-caixa" role="dialog" aria-modal="true" aria-labelledby="tituloEditor">
        <header class="modal-topo">
          <h2 id="tituloEditor">Editar veículo</h2>
          <button class="fechar" id="botaoFechar" type="button" aria-label="Fechar">×</button>
        </header>

        <form class="formulario" id="formVeiculo">
          <div class="campo-linha">
            <div class="campo">
              <label for="f-brand">Marca</label>
              <input id="f-brand" name="brand" required />
            </div>
            <div class="campo">
              <label for="f-model">Modelo</label>
              <input id="f-model" name="model" required />
            </div>
          </div>

          <div class="campo-linha">
            <div class="campo">
              <label for="f-year">Ano</label>
              <input id="f-year" name="year" type="number" inputmode="numeric" required />
            </div>
            <div class="campo">
              <label for="f-type">Tipo</label>
              <select id="f-type" name="type"></select>
            </div>
          </div>

          <div class="campo-linha">
            <div class="campo">
              <label for="f-price">Preço (R$)</label>
              <input id="f-price" name="price" inputmode="numeric" required />
              <small id="dicaPreco">&nbsp;</small>
            </div>
            <div class="campo">
              <label for="f-km">Quilometragem</label>
              <input id="f-km" name="km" inputmode="numeric" required />
              <small id="dicaKm">&nbsp;</small>
            </div>
          </div>

          <div class="campo-linha">
            <div class="campo">
              <label for="f-fuel">Combustível</label>
              <select id="f-fuel" name="fuel"></select>
            </div>
            <div class="campo">
              <label for="f-gear">Câmbio</label>
              <select id="f-gear" name="gear"></select>
            </div>
          </div>

          <div class="campo-linha">
            <div class="campo">
              <label for="f-color">Cor</label>
              <input id="f-color" name="color" />
            </div>
            <div class="campo">
              <label for="f-doors">Portas</label>
              <input id="f-doors" name="doors" type="number" inputmode="numeric" />
            </div>
          </div>

          <div class="campo">
            <label for="f-badge">Selo na foto</label>
            <select id="f-badge" name="badge"></select>
          </div>

          <fieldset class="marcadores">
            <legend>Situação</legend>
            <label class="marcador">
              <input type="checkbox" id="f-featured" name="featured" />
              <span>Destaque — aparece primeiro na listagem</span>
            </label>
            <label class="marcador">
              <input type="checkbox" id="f-sold" name="sold" />
              <span>Vendido — sai do estoque disponível</span>
            </label>
          </fieldset>

          <div class="campo">
            <span class="rotulo">Fotos</span>
            <p class="ajuda">
              A primeira foto é a capa. As imagens são reduzidas automaticamente antes do envio.
            </p>

            <div class="galeria" id="galeria"></div>

            <div class="galeria-acoes">
              <label class="btn btn-secundario" for="arquivoFoto">
                Adicionar fotos
                <input id="arquivoFoto" type="file" accept="image/*" multiple hidden />
              </label>
              <button class="btn btn-ghost" id="botaoUrl" type="button">Colar link</button>
            </div>
            <div class="colar-link" id="colarLink" hidden>
              <label class="visually-hidden" for="campoUrlFoto">Endereço da imagem</label>
              <input id="campoUrlFoto" type="url" placeholder="https://..." />
              <button class="btn btn-secundario" id="botaoAdicionarUrl" type="button">
                Adicionar
              </button>
            </div>
            <p class="progresso" id="progressoUpload" hidden></p>
          </div>

          <p class="aviso" id="avisoFormulario" role="alert" hidden></p>

          <footer class="modal-rodape">
            <button class="btn btn-perigo" id="botaoExcluir" type="button">Excluir</button>
            <div class="modal-rodape-direita">
              <button class="btn btn-ghost" id="botaoCancelar" type="button">Cancelar</button>
              <button class="btn btn-primary" type="submit">Aplicar</button>
            </div>
          </footer>
        </form>
      </div>
    </div>

    <!-- schema.js é gerado de lib/vehicle-schema.mjs (npm run data) -->
    <script src="/admin/schema.js"></script>
    <script src="/admin/admin.js"></script>
  </body>
</html>
